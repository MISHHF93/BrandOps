# Builds artifacts for **Chrome Web Store** (extension tarball) and **Google Play** prep (Capacitor Android sync).
# Play signing / `bundleRelease` still happens in Android Studio or a follow-up job with keystore secrets.
name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  chrome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - run: npm run package:release

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-extension-tarball
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 60

  capacitor-android-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/upload-artifact@v4
        with:
          name: capacitor-android-tree
          path: android/
          if-no-files-found: error
          retention-days: 30
