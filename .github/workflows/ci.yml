name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      # The test suite has its own tsconfig, and for a long time nothing ran it:
      # not `check`, not `verify`, not `release`, not CI. It had accumulated 211
      # type errors unseen, including an import of a module that does not exist
      # and a granted capability that is not in the registry. `vitest`
      # transpiles without checking types, so the suite stayed green over both.
      #
      # This is a ratchet, not a gate: the count may fall and may never rise,
      # and the budget has to be lowered in the same commit that lowers the
      # count.
      - name: Typecheck tests against their budget
        run: npm run check:tests

      # Knip was installed, configured, and run as `knip --no-exit-code` — report
      # mode forever, in no pipeline, reporting 120 unused exports to nobody.
      # Same ratchet: unused exports are budgeted and may only fall, while a file
      # nothing reaches and an import that does not resolve are held at zero.
      - name: Check reachability against its budget
        run: npm run knip

      - name: Verify formatting (Prettier)
        run: npm run format

      # Build first: the suite verifies the shipped artifact, not only the source
      # that produces it. `bundleBudget` measures dist/ chunk weight and
      # `launchGateContract` checks that the auth gate survives minification —
      # both fail rather than skip when dist/ is absent, so an unverified build
      # cannot pass as a verified one. Testing before building made those six
      # tests fail on a clean checkout.
      - name: Build extension
        run: npm run build

      - name: Run tests (unit + integration parity with release)
        run: npm run test && npm run test:integration

      - name: Verify build artifacts
        run: npm run verify:dist
